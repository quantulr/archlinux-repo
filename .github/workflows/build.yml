name: Build packages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-packages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      count: ${{ steps.check.outputs.count }}
      reconcile: ${{ steps.check.outputs.reconcile }}
    steps:
      - uses: actions/checkout@v4
      - name: Find packages to build
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_updates.py

  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PKG_NAME: ${{ matrix.package.name }}
      PKG_SOURCE: ${{ matrix.package.source }}
      PKG_METHOD: ${{ matrix.package.method }}
      PKG_URL: ${{ matrix.package.url }}
      PKG_REPO: ${{ matrix.package.repo }}
      PKG_TAG: ${{ matrix.package.tag }}
      PKG_ASSET_NAME: ${{ matrix.package.asset_name }}
      PKG_ASSET_URL: ${{ matrix.package.asset_url }}
      PKG_UPSTREAM: ${{ matrix.package.upstream }}
    steps:
      - name: Install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git go curl jq libarchive gnupg
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          install -d -o builder -g builder /build
          mkdir -p /out
      - name: Clone AUR package
        if: matrix.package.source == 'aur'
        run: git clone --depth 1 "$PKG_URL" /build/src
      - name: Build AUR package
        if: matrix.package.source == 'aur'
        run: |
          set -euo pipefail
          # Install dependencies that exist in the official repositories.
          # AUR-only dependencies (such as another package built here) are
          # left out, hence --nodeps below.
          deps=$(awk -F' = ' '/^\t(depends|makedepends|checkdepends)(_x86_64)? = / {print $2}' /build/src/.SRCINFO \
            | sed -E 's/[<>=].*$//' \
            | sed 's/:.*//' \
            | sort -u)
          install=()
          for dep in $deps; do
            case "$dep" in
              cargo|rustc) dep=rust ;;
            esac
            if pacman -T "$dep" >/dev/null 2>&1; then
              continue
            fi
            if pacman -Si "$dep" >/dev/null 2>&1; then
              install+=("$dep")
            else
              echo "::warning::$dep is not in the official repositories; skipping"
            fi
          done
          if [ "${#install[@]}" -gt 0 ]; then
            pacman -S --needed --noconfirm "${install[@]}"
          fi
          keys=$(sed -n '/^validpgpkeys=(/,/)/p' /build/src/PKGBUILD | grep -oE '[0-9A-Fa-f]{16,40}' || true)
          extra=()
          for key in $keys; do
            if ! su - builder -c "gpg --batch --keyserver keyserver.ubuntu.com --recv-keys '$key'" >/dev/null 2>&1; then
              if ! su - builder -c "gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys '$key'" >/dev/null 2>&1; then
                echo "::warning::could not import PGP key $key; skipping signature checks"
                extra+=(--skippgpcheck)
                break
              fi
            fi
          done
          chown -R builder:builder /build/src
          su - builder -c "cd /build/src && makepkg -f --noconfirm --nodeps --nocheck ${extra[*]}"
          find /build/src -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*.pkg.tar.zst' -exec cp -v {} /out/ \;
      - name: Clone mygo project
        if: matrix.package.source == 'github' && matrix.package.method == 'mygo'
        run: |
          set -euo pipefail
          if [ -n "$PKG_TAG" ]; then
            git clone --depth 1 --branch "$PKG_TAG" "$PKG_REPO" /build/src
          else
            git clone --depth 1 "$PKG_REPO" /build/src
          fi
      - name: Build mygo package
        if: matrix.package.source == 'github' && matrix.package.method == 'mygo'
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/out
          chown -R builder:builder /build/src
          su - builder -c 'cd /build/src && GOTOOLCHAIN=auto go tool mygo build -platform linux/amd64 -o /build/out'
          pkgbuild=$(find /build/out -name PKGBUILD -print -quit)
          if [ -z "$pkgbuild" ]; then
            echo "::error::mygo build generated no PKGBUILD; use source = \"aur\" or a mygo version that packages Arch Linux"
            exit 1
          fi
          dir=$(dirname "$pkgbuild")
          su - builder -c "cd '$dir' && makepkg -f --noconfirm --nodeps"
          find "$dir" -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*.pkg.tar.zst' -exec cp -v {} /out/ \;
      - name: Download prebuilt package
        if: matrix.package.method == 'prebuilt'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            -o "/out/$PKG_ASSET_NAME" \
            "$PKG_ASSET_URL"
      - name: Normalize package filenames
        run: |
          set -euo pipefail
          for pkgfile in /out/*.pkg.tar.zst; do
            [ -e "$pkgfile" ] || continue
            name=$(basename "$pkgfile")
            safe=${name//:/_}
            if [ "$name" != "$safe" ]; then
              mv -v "$pkgfile" "/out/$safe"
            fi
          done
      - name: Record built packages
        run: |
          set -euo pipefail
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          packages='[]'
          while IFS= read -r -d '' pkgfile; do
            info=$(bsdtar -xOf "$pkgfile" .PKGINFO)
            pkgname=$(sed -n 's/^pkgname = //p' <<<"$info")
            version=$(sed -n 's/^pkgver = //p' <<<"$info")
            arch=$(sed -n 's/^arch = //p' <<<"$info")
            test -n "$pkgname"
            test -n "$version"
            test -n "$arch"
            sha256=$(sha256sum "$pkgfile" | awk '{print $1}')
            size=$(stat -c %s "$pkgfile")
            packages=$(jq \
              --arg pkgname "$pkgname" \
              --arg version "$version" \
              --arg arch "$arch" \
              --arg filename "$(basename "$pkgfile")" \
              --arg sha256 "$sha256" \
              --argjson size "$size" \
              '. + [{pkgname: $pkgname, version: $version, arch: $arch, filename: $filename, sha256: $sha256, size: $size}]' \
              <<<"$packages")
          done < <(find /out -maxdepth 1 -name '*.pkg.tar.zst' -print0)
          test "$(jq 'length' <<<"$packages")" -gt 0
          vcs_revision=""
          if [[ "$PKG_NAME" == *-git ]]; then
            gitdir=$(find /build/src/src -maxdepth 4 -name .git -print -quit 2>/dev/null || true)
            if [ -n "$gitdir" ]; then
              vcs_revision=$(su - builder -c "git -C '$(dirname "$gitdir")' rev-parse HEAD" 2>/dev/null || true)
            fi
          fi
          upstream_version=""
          if [ "$PKG_SOURCE" = "github" ]; then
            upstream_version="$PKG_UPSTREAM"
          fi
          extra='{}'
          if [ -n "$vcs_revision" ]; then
            extra=$(jq --arg value "$vcs_revision" '. + {vcs_revision: $value}' <<<"$extra")
          fi
          if [ -n "$upstream_version" ]; then
            extra=$(jq --arg value "$upstream_version" '. + {upstream_version: $value}' <<<"$extra")
          fi
          jq -n --arg name "$PKG_NAME" --arg built_at "$built_at" \
            --argjson packages "$packages" --argjson extra "$extra" \
            '{name: $name, built_at: $built_at, packages: $packages} + $extra' \
            > "/out/$PKG_NAME.json"
          cat "/out/$PKG_NAME.json"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package.name }}
          path: /out/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.reconcile == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download built packages
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish.py
      - name: Record versions in TOML
        run: python3 .github/scripts/record_versions.py
      - name: Commit version updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*.toml
          if git diff --cached --quiet; then
            echo "No version changes."
            exit 0
          fi
          git commit -m "chore(packages): record built versions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
